name: Release preparation and tagging

on:
  workflow_call:
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: release-plz-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag the checked release merge
        run: python3 scripts/tag-release.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
      - name: Name the pinned preparation checkout
        run: git switch -C main "$GITHUB_SHA"
      - name: Prepare release PR
        id: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Synchronize release PR metadata
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release-pr.outputs.pr }}
          RELEASE_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          branch=$(jq -er '.head_branch' <<< "$PR")
          [[ "$branch" == release-plz-* ]]
          git fetch --no-tags origin "refs/heads/$branch"
          git checkout -B "$branch" FETCH_HEAD
          release_head=$(git rev-parse HEAD)
          python3 scripts/release-metadata.py
          if ! git diff --quiet -- docs/man/git-ca.1; then
            git config user.name "$RELEASE_BOT"
            git config user.email "${RELEASE_BOT}@users.noreply.github.com"
            git add docs/man/git-ca.1
            git commit --amend --no-edit
            git push --force-with-lease="refs/heads/$branch:$release_head" origin "HEAD:refs/heads/$branch"
          fi
